name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", django: "4.2.*" }
          - { os: ubuntu-latest, python: "3.11", django: "5.1.*" }
          - { os: ubuntu-latest, python: "3.12", django: "5.2.*" }
          - { os: ubuntu-latest, python: "3.13", django: "6.*" }
          - { os: macos-latest, python: "3.12", django: "5.2.*" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . "Django==${{ matrix.django }}" pytest
      - run: pytest -q
